<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>soccer 8196 // monkeytype edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Monkeytype Theme Variables - Default: Serika Dark */
        :root, [data-theme="serika dark"] {
            --bg-color: #323437;
            --sub-alt-color: #2c2e31;
            --sub-color: #646669;
            --text-color: #d1d0c5;
            --main-color: #e2b714;
            --error-color: #ca4754;
            --tile-base: #3b3e42;
            --keycap-shadow: #1e2022;
        }

        [data-theme="botanical"] {
            --bg-color: #1f2d27;
            --sub-alt-color: #17231e;
            --sub-color: #4f7363;
            --text-color: #eaf1f3;
            --main-color: #7bd88f;
            --error-color: #f59e0b;
            --tile-base: #263830;
            --keycap-shadow: #111916;
        }

        [data-theme="dracula"] {
            --bg-color: #282a36;
            --sub-alt-color: #21222c;
            --sub-color: #6272a4;
            --text-color: #f8f8f2;
            --main-color: #bd93f9;
            --error-color: #ff79c6;
            --tile-base: #343746;
            --keycap-shadow: #191a21;
        }

        [data-theme="nord"] {
            --bg-color: #242933;
            --sub-alt-color: #1e222a;
            --sub-color: #616e88;
            --text-color: #d8dee9;
            --main-color: #88c0d0;
            --error-color: #bf616a;
            --tile-base: #2e3440;
            --keycap-shadow: #171a20;
        }

        [data-theme="8008"] {
            --bg-color: #333a45;
            --sub-alt-color: #292f38;
            --sub-color: #939eae;
            --text-color: #e9ecf0;
            --main-color: #f44c7f;
            --error-color: #da3333;
            --tile-base: #3e4653;
            --keycap-shadow: #1f242b;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'JetBrains Mono', 'Roboto Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            touch-action: manipulation;
            transition: background-color 180ms ease, color 180ms ease;
        }

        .mt-sub { color: var(--sub-color); }
        .mt-main { color: var(--main-color); }
        .mt-text { color: var(--text-color); }
        .mt-err { color: var(--error-color); }
        .mt-bg-sub-alt { background-color: var(--sub-alt-color); }

        /* Minimalist Keycap & Pitch Container */
        .pitch-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            aspect-ratio: 1 / 1;
            background-color: var(--sub-alt-color);
            border-radius: 14px;
            padding: 12px;
            touch-action: none;
            overflow: hidden;
            border: 2px solid color-mix(in srgb, var(--sub-color) 22%, transparent);
            transition: background-color 180ms ease, border-color 180ms ease;
        }

        /* Subtle Minimalist Soccer Pitch Markings */
        .pitch-markings {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            opacity: 0.16;
        }

        .pitch-markings::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 12px;
            right: 12px;
            height: 2px;
            background: var(--sub-color);
            transform: translateY(-50%);
        }

        .pitch-markings::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 32%;
            height: 32%;
            border: 2px dashed var(--sub-color);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* 4x4 Keycap Socket Grid */
        .grid-background {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            height: 100%;
        }

        .grid-cell {
            background-color: color-mix(in srgb, var(--bg-color) 65%, var(--sub-alt-color));
            border-radius: 10px;
            border: 1px solid color-mix(in srgb, var(--sub-color) 12%, transparent);
        }

        /* Dynamic Tile Layer */
        .tile-layer {
            position: absolute;
            inset: 12px;
            z-index: 10;
            pointer-events: none;
        }

        .tile {
            position: absolute;
            width: calc((100% - 30px) / 4);
            height: calc((100% - 30px) / 4);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 115ms cubic-bezier(0.2, 1, 0.3, 1);
            will-change: transform;
        }

        /* Mechanical Keycap Styling for Tiles */
        .tile-inner {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--tile-base);
            color: var(--text-color);
            border: 1.5px solid color-mix(in srgb, var(--sub-color) 35%, transparent);
            box-shadow: 0 4px 0 var(--keycap-shadow);
            transform: translateY(-2px);
            padding: 4px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
        }

        /* Animations for Spawn and Merge */
        @keyframes spawnPop {
            0% { transform: scale(0.4) translateY(0); opacity: 0; }
            75% { transform: scale(1.05) translateY(-2px); opacity: 1; }
            100% { transform: scale(1) translateY(-2px); opacity: 1; }
        }

        @keyframes keycapPressMerge {
            0% { transform: scale(1) translateY(1px); }
            45% { transform: scale(1.14) translateY(-4px); }
            100% { transform: scale(1) translateY(-2px); }
        }

        .tile-new .tile-inner {
            animation: spawnPop 160ms ease-out forwards;
        }

        .tile-merged .tile-inner {
            animation: keycapPressMerge 190ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Monkeytype Keycap Tier Highlights */
        .tile-2 .tile-inner {
            background-color: color-mix(in srgb, var(--tile-base) 92%, var(--bg-color));
            color: var(--sub-color);
        }
        .tile-4 .tile-inner {
            background-color: var(--tile-base);
            color: var(--text-color);
        }
        .tile-8 .tile-inner {
            border-color: color-mix(in srgb, var(--text-color) 35%, transparent);
        }
        .tile-16 .tile-inner {
            border-color: color-mix(in srgb, var(--main-color) 40%, transparent);
            background-color: color-mix(in srgb, var(--tile-base) 90%, var(--main-color));
        }
        .tile-32 .tile-inner {
            border-color: color-mix(in srgb, var(--main-color) 60%, transparent);
            background-color: color-mix(in srgb, var(--tile-base) 84%, var(--main-color));
        }
        .tile-64 .tile-inner {
            border-color: var(--main-color);
            background-color: color-mix(in srgb, var(--tile-base) 76%, var(--main-color));
            color: var(--main-color);
        }
        .tile-128 .tile-inner {
            border-color: var(--main-color);
            background-color: color-mix(in srgb, var(--tile-base) 65%, var(--main-color));
            color: var(--text-color);
        }
        .tile-256 .tile-inner {
            border-color: var(--error-color);
            background-color: color-mix(in srgb, var(--tile-base) 72%, var(--error-color));
            color: var(--text-color);
        }
        .tile-512 .tile-inner {
            border-color: var(--error-color);
            background-color: color-mix(in srgb, var(--tile-base) 55%, var(--error-color));
            color: var(--text-color);
        }
        .tile-1024 .tile-inner {
            background-color: color-mix(in srgb, var(--main-color) 78%, var(--sub-alt-color));
            color: var(--bg-color);
            border-color: var(--text-color);
        }
        .tile-2048 .tile-inner {
            background-color: var(--main-color);
            color: var(--bg-color);
            border-color: var(--text-color);
            box-shadow: 0 4px 0 var(--keycap-shadow), 0 0 16px color-mix(in srgb, var(--main-color) 45%, transparent);
        }
        .tile-4096 .tile-inner {
            background-color: var(--error-color);
            color: var(--bg-color);
            border-color: var(--text-color);
            box-shadow: 0 4px 0 var(--keycap-shadow), 0 0 20px color-mix(in srgb, var(--error-color) 55%, transparent);
        }
        .tile-8196 .tile-inner {
            background: linear-gradient(135deg, var(--main-color) 0%, var(--error-color) 100%);
            color: var(--bg-color);
            border: 2px solid var(--text-color);
            box-shadow: 0 4px 0 var(--keycap-shadow), 0 0 26px color-mix(in srgb, var(--main-color) 75%, transparent);
        }

        /* Navigation & Interactive Buttons */
        .mt-btn {
            color: var(--sub-color);
            transition: color 120ms ease, background-color 120ms ease, transform 80ms ease;
        }
        .mt-btn:hover:not(:disabled) {
            color: var(--text-color);
        }
        .mt-btn.active {
            color: var(--main-color);
        }

        .kbd-badge {
            background-color: var(--sub-alt-color);
            color: var(--sub-color);
            border: 1px solid color-mix(in srgb, var(--sub-color) 30%, transparent);
            box-shadow: 0 2px 0 var(--keycap-shadow);
            border-radius: 5px;
            padding: 1px 6px;
            font-size: 11px;
            font-weight: 600;
            transition: all 120ms ease;
        }
        .kbd-badge.armed {
            background-color: var(--main-color);
            color: var(--bg-color);
            border-color: var(--main-color);
        }

        /* Floating +Score Pop */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.95); }
            100% { opacity: 0; transform: translateY(-22px) scale(1.05); }
        }
        .score-float {
            animation: floatUp 550ms ease-out forwards;
            color: var(--main-color);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between py-4 px-3 sm:py-6">

    <!-- Minimalist Monkeytype Header & Mode Bar -->
    <header class="w-full max-w-[440px] flex flex-col gap-3">
        <!-- Top Brand Row + Quick Action Bar -->
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-lg mt-bg-sub-alt flex items-center justify-center border border-white/5 text-xl shadow-sm">
                    ⚽
                </div>
                <div class="leading-none">
                    <div class="text-[10px] mt-sub tracking-widest lowercase mb-0.5">pitch merge</div>
                    <div class="flex items-baseline gap-1.5">
                        <h1 class="text-2xl font-extrabold tracking-tight mt-text lowercase">soccer</h1>
                        <span class="text-2xl font-extrabold tracking-tight mt-main">8196</span>
                    </div>
                </div>
            </div>

            <!-- Minimalist Command Bar -->
            <div class="flex items-center gap-1 mt-bg-sub-alt px-2.5 py-1.5 rounded-lg text-xs">
                <button id="undo-btn" onclick="game.undo()" disabled title="undo last move (z / backspace)"
                    class="mt-btn px-2 py-1 rounded flex items-center gap-1 disabled:opacity-30 disabled:pointer-events-none">
                    <span>↩</span>
                    <span>undo</span>
                </button>
                <span class="mt-sub opacity-30">|</span>
                <button id="sound-btn" onclick="game.toggleSound()" title="toggle switch sound (m)"
                    class="mt-btn active px-2 py-1 rounded flex items-center gap-1">
                    <span id="sound-icon">⌨️</span>
                    <span id="sound-label">thock</span>

                <span class="mt-sub opacity-30">|</span>
                <button onclick="game.restart()" title="restart match (tab + enter)"

                    <span>↻</span>

            </div>
        </div>

        <!-- Monkeytype Live Telemetry Strip (score, best, mpm, top tier) -->
        <div class="grid grid-cols-4 gap-2 mt-bg-sub-alt rounded-xl px-3.5 py-2.5">
            <div class="relative flex flex-col">
                <span class="text-[10px] mt-sub lowercase">score</span>
                <span id="score-display" class="text-lg sm:text-xl font-bold mt-main leading-tight">0</span>

            </div>
            <div class="flex flex-col">
                <span class="text-[10px] mt-sub lowercase">best</span>

            <div class="flex flex-col">
                <span class="text-[10px] mt-sub lowercase" title="moves per minute">mpm</span>

            </div>
            <div class="flex flex-col items-end text-right">
                <span class="text-[10px] mt-sub lowercase">top tier</span>
                <div id="current-rank-badge" class="text-xs sm:text-sm font-bold mt-main leading-tight truncate max-w-full mt-0.5">

                </div>
            </div>
        </div>

    <!-- Main Keycap / Pitch Game Board -->
    <main class="w-full flex flex-col items-center justify-center my-2">
        <div id="pitch-board" class="pitch-container">
            <!-- Subtle Pitch Midline & Center Circle -->
            <div class="pitch-markings"></div>

            <!-- 4x4 Keycap Socket Grid -->
            <div class="grid-background">
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            </div>

            <!-- Sliding Keycap Tiles Layer -->
            <div id="tile-layer" class="tile-layer"></div>

            <!-- Minimalist Result Overlay (Win / Full Time) -->
            <div id="game-overlay" class="hidden absolute inset-0 z-30 bg-black/75 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center transition-opacity">
                <div id="overlay-emoji" class="text-5xl mb-2">👑</div>
                <div class="text-xs mt-sub lowercase tracking-widest mb-0.5">match result</div>

                <div class="flex gap-3">
                    <button id="keep-playing-btn" onclick="game.keepPlaying()"

                    </button>
                    <button onclick="game.restart()"
                        class="px-5 py-2 rounded-lg font-bold text-xs bg-[var(--main-color)] text-[var(--bg-color)] shadow-md hover:opacity-90 transition lowercase">
                        new match
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Monkeytype Footer: Progression Strip, Keyboard Hints & Theme Switcher -->
    <footer class="w-full max-w-[440px] flex flex-col gap-2.5">
        <!-- Road to 8196 Keycap Legend + Touch D-Pad -->
        <div class="mt-bg-sub-alt rounded-xl p-2.5 flex flex-col gap-2">
            <div class="flex items-center justify-between text-[10px] mt-sub lowercase px-0.5">
                <span>progression // 4096 + 4096 = <strong class="mt-main">8196 goat</strong></span>
                <span id="moves-counter-label">0 moves</span>
            </div>
            <div id="legend-strip" class="grid grid-cols-7 sm:grid-cols-13 gap-1 text-center">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Keyboard Shortcut Hints + Theme Switcher Bar -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-2 text-[11px] mt-sub pt-1">
            <!-- Shortcut Hints -->
            <div class="flex flex-wrap items-center justify-center gap-x-3 gap-y-1">
                <div class="flex items-center gap-1">
                    <span id="tab-badge" class="kbd-badge">tab</span>
                    <span>+</span>
                    <span class="kbd-badge">enter</span>
                    <span class="ml-0.5">restart</span>
                </div>
                <div class="flex items-center gap-1">
                    <span class="kbd-badge">z</span>
                    <span class="ml-0.5">undo</span>
                </div>
                <div class="flex items-center gap-1">
                    <span class="kbd-badge">m</span>
                    <span class="ml-0.5">sound</span>
                </div>
            </div>

            <!-- Theme Switcher -->
            <div class="flex items-center gap-1.5 mt-bg-sub-alt px-2.5 py-1 rounded-lg">
                <span class="text-[10px] opacity-60">🎨</span>
                <div id="theme-switcher" class="flex items-center gap-2 text-[11px]">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
    </footer>

    <script>
        /**
         * Soccer 8196 Progression Metadata (Lowercase Monkeytype Style)
         * 2 Cleats -> 4 Socks -> 8 Shin Guards -> 16 Corner Flag -> 32 Whistle ->
         * 64 Gloves -> 128 Match Ball -> 256 Jersey -> 512 Captain -> 1024 Hat-trick ->
         * 2048 Ballon d'Or -> 4096 World Cup -> 8196 GOAT
         */
        const SOCCER_RANKS = {
            2:    { icon: '👟', label: 'cleats' },
            4:    { icon: '🧦', label: 'socks' },
            8:    { icon: '🛡️', label: 'shin guards' },
            16:   { icon: '🚩', label: 'corner flag' },
            32:   { icon: '⏱️', label: 'whistle' },
            64:   { icon: '🧤', label: 'gloves' },
            128:  { icon: '⚽', label: 'match ball' },
            256:  { icon: '👕', label: 'jersey' },
            512:  { icon: '©️', label: 'captain' },
            1024: { icon: '🎩', label: 'hat-trick' },
            2048: { icon: '🏅', label: 'ballon d\'or' },
            4096: { icon: '🏆', label: 'world cup' },
            8196: { icon: '👑', label: 'goat' }
        };

        const THEMES = ['serika dark', 'botanical', 'dracula', 'nord', '8008'];

        /**
         * Tactile Mechanical Keyboard Switch Synthesizer (Web Audio API)
         * Generates realistic "thock" and "click" key switch acoustics on slide and merge
         */
        class MechanicalAudio {
            constructor() {
                // Modes: 'thock' -> 'clicky' -> 'mute'
                this.modes = ['thock', 'clicky', 'mute'];
                this.modeIndex = 0;
                this.ctx = null;
            }

            get currentMode() {
                return this.modes[this.modeIndex];
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            cycleMode() {
                this.modeIndex = (this.modeIndex + 1) % this.modes.length;
                if (this.currentMode !== 'mute') {
                    this.playSwitchPress(false, 4);
                }
                return this.currentMode;
            }

            /**
             * Synthesizes a mechanical switch bottom-out + housing resonance
             */
            playSwitchPress(isMerge = false, highestMergeVal = 2) {
                if (this.currentMode === 'mute') return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const isClicky = this.currentMode === 'clicky';

                // 1. Short transient burst (keycap stem impact)
                const bufferSize = this.ctx.sampleRate * 0.025;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.28));
                }

                const whiteNoise = this.ctx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(isClicky ? 2600 : 950, now);
                filter.Q.setValueAtTime(isClicky ? 3.0 : 1.4, now);

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(isMerge ? 0.32 : 0.2, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.024);

                whiteNoise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);
                whiteNoise.start(now);

                // 2. Low-end case body "thock" oscillator
                const bodyOsc = this.ctx.createOscillator();
                const bodyGain = this.ctx.createGain();
                bodyOsc.type = isClicky ? 'triangle' : 'sine';

                const startFreq = isClicky ? 240 : 145;
                const endFreq = isClicky ? 75 : 42;
                bodyOsc.frequency.setValueAtTime(startFreq, now);
                bodyOsc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.055);

                bodyGain.gain.setValueAtTime(isMerge ? 0.28 : 0.2, now);
                bodyGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);

                bodyOsc.connect(bodyGain);
                bodyGain.connect(this.ctx.destination);
                bodyOsc.start(now);
                bodyOsc.stop(now + 0.065);

                // 3. Subtle harmonic tactile chime on tile merge
                if (isMerge) {
                    const step = Math.min(13, Math.log2(highestMergeVal));
                    const chimeFreq = 320 + step * 52;
                    const chimeOsc = this.ctx.createOscillator();
                    const chimeGain = this.ctx.createGain();

                    chimeOsc.type = 'sine';
                    chimeOsc.frequency.setValueAtTime(chimeFreq, now + 0.015);
                    chimeOsc.frequency.exponentialRampToValueAtTime(chimeFreq * 1.25, now + 0.11);

                    chimeGain.gain.setValueAtTime(0.12, now + 0.015);
                    chimeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                    chimeOsc.connect(chimeGain);
                    chimeGain.connect(this.ctx.destination);
                    chimeOsc.start(now + 0.015);
                    chimeOsc.stop(now + 0.125);
                }
            }

            playGoalChord() {
                if (this.currentMode === 'mute') return;
                this.init();
                if (!this.ctx) return;

                const notes = [523.25, 659.25, 783.99, 1046.5];
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + idx * 0.075;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.16, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                });
            }
        }

        /**
         * Main Soccer 8196 Monkeytype Edition Controller
         */
        class Soccer8196Game {
            constructor() {
                this.size = 4;
                this.board = [];
                this.score = 0;
                this.bestScore = parseInt(localStorage.getItem('soccer8196_best') || '0', 10);
                this.currentTheme = localStorage.getItem('soccer8196_theme') || 'serika dark';
                this.previousState = null;
                this.won = false;
                this.keepPlayingMode = false;
                this.tileIdCounter = 1;
                this.sfx = new MechanicalAudio();

                // Telemetry for MPM (Moves Per Minute)
                this.moveTimestamps = [];
                this.totalMoves = 0;
                this.tabArmed = false;
                this.tabArmTimer = null;

                // DOM References
                this.tileLayer = document.getElementById('tile-layer');
                this.scoreDisplay = document.getElementById('score-display');
                this.bestDisplay = document.getElementById('best-display');
                this.mpmDisplay = document.getElementById('mpm-display');
                this.movesCounterLabel = document.getElementById('moves-counter-label');
                this.scoreFloatContainer = document.getElementById('score-float-container');
                this.undoBtn = document.getElementById('undo-btn');
                this.soundBtn = document.getElementById('sound-btn');
                this.soundIcon = document.getElementById('sound-icon');
                this.soundLabel = document.getElementById('sound-label');
                this.rankBadge = document.getElementById('current-rank-badge');
                this.overlay = document.getElementById('game-overlay');
                this.overlayEmoji = document.getElementById('overlay-emoji');
                this.overlayTitle = document.getElementById('overlay-title');
                this.overlaySubtitle = document.getElementById('overlay-subtitle');
                this.keepPlayingBtn = document.getElementById('keep-playing-btn');
                this.tabBadge = document.getElementById('tab-badge');

                this.applyTheme(this.currentTheme);
                this.renderLegend();
                this.setupInputs();
                this.restart();

                // Live MPM decay ticker
                setInterval(() => this.updateMPMDisplay(), 1000);
            }

            applyTheme(themeName) {
                this.currentTheme = themeName;
                document.documentElement.setAttribute('data-theme', themeName);
                localStorage.setItem('soccer8196_theme', themeName);
                this.renderThemeSwitcher();
            }

            renderThemeSwitcher() {
                const container = document.getElementById('theme-switcher');
                container.innerHTML = THEMES.map(t => {
                    const isActive = t === this.currentTheme;
                    return `<button onclick="game.applyTheme('${t}')" class="mt-btn ${isActive ? 'active font-bold underline underline-offset-4' : ''}">${t}</button>`;
                }).join('');
            }

            renderLegend() {
                const strip = document.getElementById('legend-strip');
                const keys = [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8196];
                strip.innerHTML = keys.map(val => {
                    const info = SOCCER_RANKS[val];
                    return `
                        <div title="${val} • ${info.label}" class="flex flex-col items-center justify-center rounded py-1 px-0.5 bg-[var(--bg-color)] border border-white/5">
                            <span class="text-xs leading-none">${info.icon}</span>
                            <span class="text-[9px] font-bold mt-text mt-0.5">${val}</span>
                        </div>
                    `;
                }).join('');
            }

            restart() {
                this.board = Array.from({ length: this.size }, () => Array(this.size).fill(null));
                this.score = 0;
                this.previousState = null;
                this.won = false;
                this.keepPlayingMode = false;
                this.moveTimestamps = [];
                this.totalMoves = 0;
                this.hideOverlay();

                this.spawnRandomTile();
                this.spawnRandomTile();
                this.updateUI();
                this.renderTiles();
            }

            undo() {
                if (!this.previousState) return;
                this.board = this.previousState.board;
                this.score = this.previousState.score;
                this.totalMoves = Math.max(0, this.totalMoves - 1);
                this.previousState = null;
                this.sfx.playSwitchPress(false, 2);
                this.hideOverlay();
                this.updateUI();
                this.renderTiles();
            }

            toggleSound() {
                const mode = this.sfx.cycleMode();
                if (mode === 'mute') {
                    this.soundBtn.classList.remove('active');
                    this.soundIcon.textContent = '🔇';
                    this.soundLabel.textContent = 'mute';
                } else {
                    this.soundBtn.classList.add('active');
                    this.soundIcon.textContent = '⌨️';
                    this.soundLabel.textContent = mode;
                }
            }

            recordMoveTelemetry() {
                const now = Date.now();
                this.totalMoves++;
                this.moveTimestamps.push(now);
                this.updateMPMDisplay();
            }

            updateMPMDisplay() {
                const now = Date.now();
                // Keep moves from the last 15 seconds and extrapolate to 60s for responsive MPM
                this.moveTimestamps = this.moveTimestamps.filter(t => now - t <= 15000);
                const mpm = Math.round(this.moveTimestamps.length * 4);
                this.mpmDisplay.textContent = mpm;
                this.movesCounterLabel.textContent = `${this.totalMoves} ${this.totalMoves === 1 ? 'move' : 'moves'}`;
            }

            spawnRandomTile() {
                const emptyCells = [];
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (!this.board[r][c]) emptyCells.push({ r, c });
                    }
                }
                if (emptyCells.length === 0) return false;

                const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                const value = Math.random() < 0.9 ? 2 : 4;
                this.board[r][c] = {
                    id: this.tileIdCounter++,
                    value,
                    r,
                    c,
                    isNew: true,
                    mergedFrom: null
                };
                return true;
            }

            /**
             * Custom 8196 Merge Rule: 4096 + 4096 = 8196 GOAT
             */
            getNextMergedValue(val) {
                if (val === 4096) return 8196;
                return val * 2;
            }

            move(direction) {
                if (!this.overlay.classList.contains('hidden')) return;

                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (this.board[r][c]) {
                            this.board[r][c].isNew = false;
                            this.board[r][c].mergedFrom = null;
                        }
                    }
                }

                const vectorMap = {
                    up:    { dr: -1, dc: 0 },
                    down:  { dr: 1,  dc: 0 },
                    left:  { dr: 0,  dc: -1 },
                    right: { dr: 0,  dc: 1 }
                };
                const vector = vectorMap[direction];
                if (!vector) return;

                const rowOrder = [0, 1, 2, 3];
                const colOrder = [0, 1, 2, 3];
                if (vector.dr === 1) rowOrder.reverse();
                if (vector.dc === 1) colOrder.reverse();

                const snapshotBoard = this.board.map(row =>
                    row.map(cell => (cell ? { ...cell, mergedFrom: null, isNew: false } : null))
                );
                const snapshotScore = this.score;

                let moved = false;
                let pointsEarned = 0;
                let highestMergeValue = 0;

                for (const r of rowOrder) {
                    for (const c of colOrder) {
                        const tile = this.board[r][c];
                        if (!tile) continue;

                        let targetR = r;
                        let targetC = c;

                        while (true) {
                            const nextR = targetR + vector.dr;
                            const nextC = targetC + vector.dc;

                            if (nextR < 0 || nextR >= this.size || nextC < 0 || nextC >= this.size) break;

                            const nextTile = this.board[nextR][nextC];
                            if (!nextTile) {
                                targetR = nextR;
                                targetC = nextC;
                            } else if (nextTile.value === tile.value && !nextTile.mergedFrom) {
                                targetR = nextR;
                                targetC = nextC;
                                break;
                            } else {
                                break;
                            }
                        }

                        if (targetR !== r || targetC !== c) {
                            moved = true;
                            const occupant = this.board[targetR][targetC];

                            if (occupant && occupant.value === tile.value && !occupant.mergedFrom) {
                                const newValue = this.getNextMergedValue(tile.value);
                                const mergedTile = {
                                    id: this.tileIdCounter++,
                                    value: newValue,
                                    r: targetR,
                                    c: targetC,
                                    isNew: false,
                                    mergedFrom: [tile, occupant]
                                };
                                this.board[targetR][targetC] = mergedTile;
                                this.board[r][c] = null;

                                pointsEarned += newValue;
                                if (newValue > highestMergeValue) highestMergeValue = newValue;
                            } else {
                                this.board[targetR][targetC] = tile;
                                this.board[r][c] = null;
                                tile.r = targetR;
                                tile.c = targetC;
                            }
                        }
                    }
                }

                if (!moved) return;

                this.previousState = {
                    board: snapshotBoard,
                    score: snapshotScore
                };

                this.recordMoveTelemetry();

                this.score += pointsEarned;
                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    localStorage.setItem('soccer8196_best', String(this.bestScore));
                }

                if (pointsEarned > 0) {
                    this.showScoreFloat(pointsEarned);
                    if (highestMergeValue >= 8196) {
                        this.sfx.playGoalChord();
                    } else {
                        this.sfx.playSwitchPress(true, highestMergeValue);
                    }
                } else {
                    this.sfx.playSwitchPress(false, 2);
                }

                this.spawnRandomTile();
                this.updateUI();
                this.renderTiles();
                this.checkGameStatus();
            }

            showScoreFloat(points) {
                const el = document.createElement('div');
                el.className = 'score-float text-xs font-bold';
                el.textContent = `+${points}`;
                this.scoreFloatContainer.appendChild(el);
                setTimeout(() => el.remove(), 550);
            }

            getHighestTile() {
                let max = 2;
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (this.board[r][c] && this.board[r][c].value > max) {
                            max = this.board[r][c].value;
                        }
                    }
                }
                return max;
            }

            updateUI() {
                this.scoreDisplay.textContent = this.score.toLocaleString();
                this.bestDisplay.textContent = this.bestScore.toLocaleString();
                this.undoBtn.disabled = !this.previousState;

                const topVal = this.getHighestTile();
                const meta = SOCCER_RANKS[topVal] || { icon: '👑', label: 'goat' };
                this.rankBadge.textContent = `${meta.icon} ${topVal} ${meta.label}`;
            }

            renderTiles() {
                const existingNodes = new Map();
                Array.from(this.tileLayer.children).forEach(node => {
                    const id = Number(node.dataset.id);
                    if (id) existingNodes.set(id, node);
                });

                const activeIds = new Set();

                const placeTileNode = (tileObj, isGhost = false) => {
                    activeIds.add(tileObj.id);
                    let node = existingNodes.get(tileObj.id);

                    const meta = SOCCER_RANKS[tileObj.value] || { icon: '⚽', label: 'pro' };
                    const colorClass = `tile-${Math.min(tileObj.value, 8196)}`;
                    const numDigits = String(tileObj.value).length;
                    const fontSizeClass = numDigits >= 4 ? 'text-sm sm:text-base' : 'text-base sm:text-lg';

                    if (!node) {
                        node = document.createElement('div');
                        node.dataset.id = tileObj.id;
                        node.className = `tile ${colorClass}`;
                        if (tileObj.isNew) node.classList.add('tile-new');
                        if (tileObj.mergedFrom) node.classList.add('tile-merged');

                        node.innerHTML = `
                            <div class="tile-inner">
                                <div class="text-lg sm:text-xl leading-none">${meta.icon}</div>
                                <div class="${fontSizeClass} font-extrabold leading-tight mt-0.5">${tileObj.value}</div>
                                <div class="text-[8px] sm:text-[9px] font-medium lowercase opacity-75 leading-none truncate max-w-full px-1">${meta.label}</div>
                            </div>
                        `;
                        this.tileLayer.appendChild(node);
                    } else {
                        node.classList.remove('tile-new', 'tile-merged');
                        if (tileObj.mergedFrom && !isGhost) {
                            node.classList.add('tile-merged');
                        }
                    }

                    const xCalc = `calc(${tileObj.c * 100}% + ${tileObj.c * 10}px)`;
                    const yCalc = `calc(${tileObj.r * 100}% + ${tileObj.r * 10}px)`;
                    node.style.transform = `translate(${xCalc}, ${yCalc})`;
                    node.style.zIndex = isGhost ? '5' : (tileObj.mergedFrom ? '15' : '10');
                };

                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        const cell = this.board[r][c];
                        if (!cell) continue;

                        if (cell.mergedFrom) {
                            cell.mergedFrom.forEach(ghost => {
                                ghost.r = cell.r;
                                ghost.c = cell.c;
                                placeTileNode(ghost, true);
                            });
                        }
                        placeTileNode(cell, false);
                    }
                }

                existingNodes.forEach((node, id) => {
                    if (!activeIds.has(id)) node.remove();
                });

                setTimeout(() => {
                    Array.from(this.tileLayer.children).forEach(node => {
                        if (node.style.zIndex === '5') node.remove();
                    });
                }, 125);
            }

            hasMovesAvailable() {
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        const current = this.board[r][c];
                        if (!current) return true;
                        if (r < this.size - 1 && this.board[r + 1][c] && this.board[r + 1][c].value === current.value) return true;
                        if (c < this.size - 1 && this.board[r][c + 1] && this.board[r][c + 1].value === current.value) return true;
                    }
                }
                return false;
            }

            checkGameStatus() {
                const highest = this.getHighestTile();
                if (highest >= 8196 && !this.won && !this.keepPlayingMode) {
                    this.won = true;
                    this.showOverlay(
                        '👑',
                        'goal // 8196 goat',
                        `you unlocked the 8196 championship keycap in ${this.totalMoves} moves.`,
                        true
                    );
                    return;
                }

                if (!this.hasMovesAvailable()) {
                    this.showOverlay(
                        '⏱️',
                        'full time',
                        `no more passes available. final score: ${this.score.toLocaleString()} (${this.totalMoves} moves)`,
                        false
                    );
                }
            }

            showOverlay(emoji, title, subtitle, allowKeepPlaying) {
                this.overlayEmoji.textContent = emoji;
                this.overlayTitle.textContent = title;
                this.overlaySubtitle.textContent = subtitle;
                if (allowKeepPlaying) {
                    this.keepPlayingBtn.classList.remove('hidden');
                } else {
                    this.keepPlayingBtn.classList.add('hidden');
                }
                this.overlay.classList.remove('hidden');
            }

            hideOverlay() {
                this.overlay.classList.add('hidden');
            }

            keepPlaying() {
                this.keepPlayingMode = true;
                this.hideOverlay();
            }

            setupInputs() {
                window.addEventListener('keydown', (e) => {
                    // Monkeytype signature `Tab + Enter` quick restart combo
                    if (e.key === 'Tab') {
                        e.preventDefault();
                        this.tabArmed = true;
                        this.tabBadge.classList.add('armed');
                        clearTimeout(this.tabArmTimer);
                        this.tabArmTimer = setTimeout(() => {
                            this.tabArmed = false;
                            this.tabBadge.classList.remove('armed');
                        }, 1600);
                        return;
                    }

                    if (e.key === 'Enter' && this.tabArmed) {
                        e.preventDefault();
                        this.tabArmed = false;
                        this.tabBadge.classList.remove('armed');
                        this.sfx.playSwitchPress(false, 4);
                        this.restart();
                        return;
                    }

                    const keyMap = {
                        ArrowUp: 'up',    KeyW: 'up',    KeyK: 'up',
                        ArrowDown: 'down',  KeyS: 'down',  KeyJ: 'down',
                        ArrowLeft: 'left',  KeyA: 'left',  KeyH: 'left',
                        ArrowRight: 'right', KeyD: 'right', KeyL: 'right'
                    };
                    const dir = keyMap[e.code] || keyMap[e.key];
                    if (dir) {
                        e.preventDefault();
                        this.move(dir);
                    } else if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace') {
                        e.preventDefault();
                        this.undo();
                    } else if (e.key === 'm' || e.key === 'M') {
                        e.preventDefault();
                        this.toggleSound();
                    }
                });

                // Touch Swipe Controls on the Pitch
                const pitch = document.getElementById('pitch-board');
                let startX = 0;
                let startY = 0;

                pitch.addEventListener('touchstart', (e) => {
                    if (e.touches.length !== 1) return;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                }, { passive: true });

                pitch.addEventListener('touchend', (e) => {
                    if (e.changedTouches.length !== 1) return;
                    const dx = e.changedTouches[0].clientX - startX;
                    const dy = e.changedTouches[0].clientY - startY;
                    const absX = Math.abs(dx);
                    const absY = Math.abs(dy);

                    if (Math.max(absX, absY) > 24) {
                        if (absX > absY) {
                            this.move(dx > 0 ? 'right' : 'left');
                        } else {
                            this.move(dy > 0 ? 'down' : 'up');
                        }
                    }
                }, { passive: true });
            }
        }

        let game;
        window.onload = function () {
            game = new Soccer8196Game();
        };
    </script>
